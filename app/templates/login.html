<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LecAI</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 15% 20%, rgba(59,130,246,0.35), transparent 40%),
                        radial-gradient(circle at 85% 15%, rgba(168,85,247,0.30), transparent 45%),
                        radial-gradient(circle at 50% 100%, rgba(16,185,129,0.15), transparent 50%),
                        #05070f;
            background-attachment: fixed;
        }
        .blob {
            position: fixed;
            border-radius: 9999px;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
            animation: float 12s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.08); }
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(96, 165, 250, 0.6);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .btn-glow {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .btn-glow:hover { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.45); transform: translateY(-1px); }
        .btn-glow:active { transform: translateY(0); }
    </style>
</head>
<body class="text-white h-screen flex items-center justify-center overflow-hidden relative">

    <div class="blob w-96 h-96 bg-blue-600 -top-20 -left-20"></div>
    <div class="blob w-96 h-96 bg-purple-600 top-1/3 -right-24" style="animation-delay: -4s;"></div>
    <div class="blob w-72 h-72 bg-emerald-500 bottom-0 left-1/3" style="animation-delay: -8s;"></div>

    <div class="glass relative z-10 p-8 md:p-10 rounded-3xl w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 shadow-lg shadow-blue-900/40 mb-4">
                <i class="fas fa-brain text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-300 to-purple-300">LecAI</h1>
            <p class="text-sm text-white/50 mt-1">계정에 로그인하세요</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Username</label>
                <input type="text" name="username" required autocomplete="username"
                    class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="아이디를 입력하세요">
            </div>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="w-full btn-glow py-2.5 rounded-xl font-bold transition text-sm mt-2">
                로그인
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-white/50">
            계정이 없으신가요? <a href="/signup" class="text-blue-300 hover:text-blue-200 font-medium hover:underline">회원가입</a>
        </p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            loginBtn.disabled = true;
            const originalText = loginBtn.textContent;
            loginBtn.textContent = '로그인 중...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    alert(data.detail || '로그인 실패');
                }
            } catch (err) {
                alert('오류 발생');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
