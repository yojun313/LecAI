<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('lecai_theme_style');if(t&&t!=='default')document.documentElement.setAttribute('data-ui-theme',t);if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-ui-theme-mode','light');}else{document.documentElement.classList.add('dark');}}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - LecAI</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 15% 20%, rgba(59,130,246,0.35), transparent 40%),
                        radial-gradient(circle at 85% 15%, rgba(168,85,247,0.30), transparent 45%),
                        radial-gradient(circle at 50% 100%, rgba(16,185,129,0.15), transparent 50%),
                        #05070f;
            background-attachment: fixed;
        }
        .blob {
            position: fixed;
            border-radius: 9999px;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
            animation: float 12s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.08); }
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(96, 165, 250, 0.6);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .btn-glow {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .btn-glow:hover { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.45); transform: translateY(-1px); }
        .btn-glow:active { transform: translateY(0); }
    </style>
    <link rel="stylesheet" href="/static/shared/theme.css">
    <style>
        .step[hidden] { display: none !important; }
        .code-input { letter-spacing: .5em; text-align: center; font-family: ui-monospace, Menlo, monospace; font-size: 20px; }
        .msg-ok { color: #6ee7b7; } .msg-err { color: #fca5a5; }
        html[data-ui-theme-mode="light"] .msg-ok { color: #047857; } html[data-ui-theme-mode="light"] .msg-err { color: #b91c1c; }
    </style>
</head>
<body class="text-white h-screen flex items-center justify-center overflow-hidden relative">
    <button id="themeSettingsBtn" class="theme-settings-btn" type="button" title="테마 설정" aria-label="테마 설정" style="position:fixed;top:16px;right:16px;z-index:100;"><i class="fas fa-palette text-sm"></i></button>
    <div class="blob w-96 h-96 bg-blue-600 -top-20 -left-20"></div>
    <div class="blob w-96 h-96 bg-purple-600 top-1/3 -right-24" style="animation-delay: -4s;"></div>

    <div class="glass relative z-10 p-8 md:p-10 rounded-3xl w-full max-w-sm mx-4">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 shadow-lg shadow-blue-900/40 mb-4">
                <i class="fas fa-key text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold">비밀번호 찾기</h1>
            <p id="stepHint" class="text-sm text-white/50 mt-1">가입할 때 쓴 이메일을 입력하세요</p>
            <div class="flex justify-center gap-1.5 mt-4" aria-hidden="true">
                <span class="dot w-8 h-1.5 rounded-full bg-blue-400"></span><span class="dot w-8 h-1.5 rounded-full bg-white/15"></span><span class="dot w-8 h-1.5 rounded-full bg-white/15"></span>
            </div>
        </div>

        <!-- 1. 이메일 -->
        <form id="step1" class="step space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">이메일</label>
                <input type="email" id="email" required autocomplete="email" class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="you@example.com">
            </div>
            <button type="submit" id="sendBtn" class="w-full btn-glow py-2.5 rounded-xl font-bold transition text-sm">인증 코드 받기</button>
        </form>

        <!-- 2. 코드 -->
        <form id="step2" class="step space-y-4" hidden>
            <p class="text-xs text-white/55 leading-relaxed"><span id="sentTo" class="font-bold text-white/80"></span> 로 6자리 코드를 보냈습니다. 메일이 보이지 않으면 스팸함도 확인해 주세요. 코드는 10분 동안 유효합니다.</p>
            <input type="text" id="code" inputmode="numeric" maxlength="6" required autocomplete="one-time-code" class="code-input w-full px-4 py-3 rounded-xl glass-input outline-none placeholder-white/20" placeholder="000000">
            <button type="submit" id="verifyBtn" class="w-full btn-glow py-2.5 rounded-xl font-bold transition text-sm">확인</button>
            <div class="flex justify-between text-xs">
                <button type="button" id="backBtn" class="text-white/50 hover:text-white">이메일 다시 입력</button>
                <button type="button" id="resendBtn" class="text-blue-300 hover:text-blue-200 disabled:opacity-40 disabled:pointer-events-none">코드 다시 받기</button>
            </div>
        </form>

        <!-- 3. 새 비밀번호 -->
        <form id="step3" class="step space-y-4" hidden>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">계정</label>
                <select id="username" class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm"></select>
            </div>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">새 비밀번호 (8자 이상)</label>
                <input type="password" id="pw1" required minlength="8" autocomplete="new-password" class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">새 비밀번호 확인</label>
                <input type="password" id="pw2" required minlength="8" autocomplete="new-password" class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="••••••••">
            </div>
            <button type="submit" id="resetBtn" class="w-full btn-glow py-2.5 rounded-xl font-bold transition text-sm">비밀번호 변경</button>
            <p class="text-[11px] text-white/40">변경하면 이 계정은 모든 기기에서 로그아웃됩니다.</p>
        </form>

        <!-- 완료 -->
        <div id="step4" class="step text-center space-y-4" hidden>
            <i class="fas fa-circle-check text-4xl text-emerald-400"></i>
            <p class="text-sm text-white/70">비밀번호를 변경했습니다.<br>새 비밀번호로 로그인해 주세요.</p>
            <a href="/login" class="block w-full btn-glow py-2.5 rounded-xl font-bold transition text-sm">로그인하러 가기</a>
        </div>

        <p id="msg" class="text-xs mt-4 text-center min-h-[1rem]"></p>
        <p class="mt-4 text-center text-sm text-white/50"><a href="/login" class="text-blue-300 hover:text-blue-200 hover:underline">로그인으로 돌아가기</a></p>
    </div>

<script>
(() => {
    const $ = (id) => document.getElementById(id);
    let email = '', token = '', cooldownTimer = null;
    const HINTS = ['가입할 때 쓴 이메일을 입력하세요', '메일로 받은 인증 코드를 입력하세요', '새 비밀번호를 정하세요', ''];
    function show(n) {
        [1, 2, 3, 4].forEach(i => $('step' + i).hidden = i !== n);
        $('stepHint').textContent = HINTS[n - 1];
        document.querySelectorAll('.dot').forEach((d, i) => { d.classList.toggle('bg-blue-400', i < n); d.classList.toggle('bg-white/15', i >= n); });
        setMsg('');
        const f = { 1: 'email', 2: 'code', 3: 'pw1' }[n]; if (f) setTimeout(() => $(f).focus(), 30);
    }
    function setMsg(text, ok) { $('msg').textContent = text || ''; $('msg').className = 'text-xs mt-4 text-center min-h-[1rem] ' + (ok ? 'msg-ok' : 'msg-err'); }
    async function post(url, body) {
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || '오류가 발생했습니다.');
        return d;
    }
    function startCooldown(sec) {
        clearInterval(cooldownTimer); let left = sec; const b = $('resendBtn');
        b.disabled = true; b.textContent = `코드 다시 받기 (${left}s)`;
        cooldownTimer = setInterval(() => { left--; if (left <= 0) { clearInterval(cooldownTimer); b.disabled = false; b.textContent = '코드 다시 받기'; } else b.textContent = `코드 다시 받기 (${left}s)`; }, 1000);
    }
    async function sendCode(btn) {
        btn.disabled = true;
        try { const d = await post('/api/auth/password-reset/request', { email }); $('sentTo').textContent = email; show(2); setMsg(d.message, true); startCooldown(60); }
        catch (e) { setMsg(e.message); }
        finally { btn.disabled = false; }
    }
    $('step1').addEventListener('submit', (e) => { e.preventDefault(); email = $('email').value.trim(); if (email) sendCode($('sendBtn')); });
    $('resendBtn').addEventListener('click', () => sendCode($('resendBtn')));
    $('backBtn').addEventListener('click', () => show(1));
    $('code').addEventListener('input', () => { $('code').value = $('code').value.replace(/\D/g, '').slice(0, 6); if ($('code').value.length === 6) $('step2').requestSubmit(); });
    $('step2').addEventListener('submit', async (e) => {
        e.preventDefault(); const b = $('verifyBtn'); b.disabled = true;
        try {
            const d = await post('/api/auth/password-reset/verify', { email, code: $('code').value.trim() });
            token = d.token;
            $('username').innerHTML = d.usernames.map(u => `<option class="bg-[#0f1424]" value="${u.replace(/"/g, '&quot;')}">${u.replace(/</g, '&lt;')}</option>`).join('');
            $('username').disabled = d.usernames.length === 1;
            show(3);
        } catch (err) { setMsg(err.message); $('code').select(); }
        finally { b.disabled = false; }
    });
    $('step3').addEventListener('submit', async (e) => {
        e.preventDefault();
        if ($('pw1').value !== $('pw2').value) return setMsg('두 비밀번호가 다릅니다.');
        if ($('pw1').value.length < 8) return setMsg('비밀번호는 8자 이상이어야 합니다.');
        const b = $('resetBtn'); b.disabled = true;
        try { await post('/api/auth/password-reset/confirm', { email, token, username: $('username').value, password: $('pw1').value }); show(4); }
        catch (err) { setMsg(err.message); }
        finally { b.disabled = false; }
    });
    const pre = new URLSearchParams(location.search).get('email'); if (pre) $('email').value = pre;
    show(1);
})();
</script>
<script src="/static/shared/theme.js"></script>
</body>
</html>
