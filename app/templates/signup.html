<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LecAI</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 15% 20%, rgba(16,185,129,0.30), transparent 40%),
                        radial-gradient(circle at 85% 15%, rgba(59,130,246,0.28), transparent 45%),
                        radial-gradient(circle at 50% 100%, rgba(168,85,247,0.15), transparent 50%),
                        #05070f;
            background-attachment: fixed;
        }
        .blob {
            position: fixed;
            border-radius: 9999px;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
            animation: float 12s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(1.08); }
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(52, 211, 153, 0.6);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
        }
        .btn-glow-green {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
        }
        .btn-glow-green:hover { box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); transform: translateY(-1px); }
        .btn-glow-green:active { transform: translateY(0); }
        .btn-glow-blue {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }
        .btn-glow-blue:hover { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); transform: translateY(-1px); }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    </style>
</head>
<body class="text-white h-screen flex items-center justify-center overflow-hidden relative">

    <div class="blob w-96 h-96 bg-emerald-500 -top-20 -left-20"></div>
    <div class="blob w-96 h-96 bg-blue-600 top-1/3 -right-24" style="animation-delay: -4s;"></div>
    <div class="blob w-72 h-72 bg-purple-600 bottom-0 left-1/3" style="animation-delay: -8s;"></div>

    <div class="glass relative z-10 p-8 md:p-10 rounded-3xl w-full max-w-sm mx-4 my-6 max-h-[92vh] overflow-y-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-blue-600 shadow-lg shadow-emerald-900/40 mb-4">
                <i class="fas fa-user-plus text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 to-blue-300">Sign Up</h1>
            <p class="text-sm text-white/50 mt-1">LecAI 계정을 새로 만드세요</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Username</label>
                <input type="text" name="username" required autocomplete="username"
                    class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="사용할 아이디">
            </div>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Email</label>
                <input type="email" name="email" id="inputEmail" required autocomplete="email"
                    class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium mb-1.5 text-white/60">Password</label>
                <input type="password" name="password" required autocomplete="new-password"
                    class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-sm placeholder-white/30" placeholder="••••••••">
            </div>
            <button type="submit" id="sendBtn" class="w-full btn-glow-green py-2.5 rounded-xl font-bold transition text-sm mt-2">
                인증 메일 발송
            </button>
        </form>

        <div id="verifySection" class="hidden mt-6 space-y-4 border-t border-white/10 pt-6">
            <p class="text-xs text-amber-300/90 text-center flex items-center justify-center gap-1.5">
                <i class="fas fa-envelope-open-text"></i> 이메일로 전송된 인증 코드를 입력하세요.
            </p>
            <input type="text" id="verifyCode" placeholder="6자리 코드" maxlength="6"
                class="w-full px-4 py-2.5 rounded-xl glass-input outline-none text-center tracking-[0.5em] text-xl placeholder-white/20 placeholder:tracking-normal">
            <button id="verifyBtn" class="w-full btn-glow-blue py-2.5 rounded-xl font-bold transition text-sm">
                확인 및 가입 완료
            </button>
        </div>

        <p class="mt-6 text-center text-sm text-white/50">
            이미 계정이 있으신가요? <a href="/login" class="text-emerald-300 hover:text-emerald-200 font-medium hover:underline">로그인</a>
        </p>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const verifySection = document.getElementById('verifySection');
        const sendBtn = document.getElementById('sendBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const inputEmail = document.getElementById('inputEmail');

        // 1단계: 인증 메일 발송 요청
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            sendBtn.disabled = true;
            sendBtn.textContent = "발송 중...";

            try {
                const res = await fetch('/api/auth/signup/request', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    alert('인증 메일이 발송되었습니다. 이메일을 확인해주세요.');
                    signupForm.classList.add('btn-disabled', 'opacity-50', 'pointer-events-none');
                    verifySection.classList.remove('hidden');
                } else {
                    const data = await res.json();
                    alert(data.detail || '발송 실패');
                    sendBtn.disabled = false;
                    sendBtn.textContent = "인증 메일 발송";
                }
            } catch (err) {
                alert('오류 발생');
                sendBtn.disabled = false;
                sendBtn.textContent = "인증 메일 발송";
            }
        });

        // 2단계: 인증 코드 확인 요청
        verifyBtn.addEventListener('click', async () => {
            const code = document.getElementById('verifyCode').value;
            const email = inputEmail.value;

            verifyBtn.disabled = true;
            const originalText = verifyBtn.textContent;
            verifyBtn.textContent = '확인 중...';

            try {
                const res = await fetch('/api/auth/signup/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, code })
                });

                if (res.ok) {
                    alert('가입이 완료되었습니다! 로그인해주세요.');
                    window.location.href = '/login';
                } else {
                    const data = await res.json();
                    alert(data.detail || '인증 실패');
                }
            } catch (err) {
                alert('오류 발생');
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
