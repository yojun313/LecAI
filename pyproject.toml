readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "pdf2image>=1.17.0",
    "pdfkit>=1.0.0",
    "pillow>=12.2.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "uvicorn>=0.46.0",
]
